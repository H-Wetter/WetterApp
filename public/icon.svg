<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App-Symbol der Wetter-App: Sonne hinter einer Wolke auf blauem Grund.
       Randlos (kein Eckenradius) – die Handys runden die Ecken selbst ab.
       Nur einfache Formen, damit scripts/make-icons.mjs die PNG-Bilder genau gleich zeichnen kann.
       Wer das Symbol ändert, ändert es an BEIDEN Stellen und ruft danach `npm run icons` auf. -->
  <rect width="512" height="512" fill="#2f6fdd" />
  <g stroke="#ffd43b" stroke-width="20" stroke-linecap="round">
    <line x1="310" y1="92" x2="310" y2="66" />
    <line x1="418" y1="200" x2="444" y2="200" />
    <line x1="386" y1="124" x2="404" y2="106" />
    <line x1="234" y1="124" x2="216" y2="106" />
    <line x1="386" y1="276" x2="404" y2="294" />
  </g>
  <circle cx="310" cy="200" r="76" fill="#ffd43b" />
  <g fill="#ffffff">
    <circle cx="200" cy="330" r="56" />
    <circle cx="270" cy="282" r="78" />
    <circle cx="360" cy="320" r="66" />
    <rect x="200" y="320" width="160" height="66" />
  </g>
</svg>
